# ============================================================================
# Docker Compose — Rural Hospital Economics Simulator
# Chapter 35 — Production Deployment Stack
# ============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # Julia Application Server
  # --------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rhsim-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - JULIA_PROJECT=/app
      - JULIA_NUM_THREADS=auto
      - GENIE_ENV=prod
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data/uploads
      - app-exports:/app/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rhsim-network
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G

  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rhsim-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhsim -d rhsim_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rhsim-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # --------------------------------------------------------------------------
  # Redis Cache / Job Queue
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rhsim-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rhsim-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: rhsim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - rhsim-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

# --------------------------------------------------------------------------
# Volumes
# --------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-data:
    driver: local
  app-exports:
    driver: local
  nginx-certs:
    driver: local
  nginx-logs:
    driver: local

# --------------------------------------------------------------------------
# Networks
# --------------------------------------------------------------------------
networks:
  rhsim-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
