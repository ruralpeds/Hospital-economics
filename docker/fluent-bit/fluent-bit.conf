# ============================================================================
# Fluent Bit Configuration — Rural Hospital Economics Simulator
# SIEM Log Shipping Infrastructure
# ============================================================================

# --------------------------------------------------------------------------
# Service Configuration
# --------------------------------------------------------------------------
[SERVICE]
    Flush           5
    Daemon          off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

# --------------------------------------------------------------------------
# Input: Application Logs (structured JSON)
# --------------------------------------------------------------------------
[INPUT]
    Name            tail
    Tag             rhsim.app
    Path            /var/log/rhsim/app.log
    Parser          json
    DB              /var/log/rhsim/flb_app.db
    Mem_Buf_Limit   5MB
    Skip_Long_Lines On
    Refresh_Interval 10

# --------------------------------------------------------------------------
# Input: Audit Logs (structured JSON, append-only)
# --------------------------------------------------------------------------
[INPUT]
    Name            tail
    Tag             rhsim.audit
    Path            /var/log/rhsim/audit.log
    Parser          json
    DB              /var/log/rhsim/flb_audit.db
    Mem_Buf_Limit   10MB
    Skip_Long_Lines On
    Refresh_Interval 5

# --------------------------------------------------------------------------
# Filter: Enrich all records with host/environment metadata
# --------------------------------------------------------------------------
[FILTER]
    Name            record_modifier
    Match           *
    Record          hostname ${HOSTNAME}
    Record          environment ${ENVIRONMENT}
    Record          app_name rhsim

# --------------------------------------------------------------------------
# Output: Application logs to CloudWatch Logs
# --------------------------------------------------------------------------
[OUTPUT]
    Name            cloudwatch_logs
    Match           rhsim.app
    region          ${AWS_REGION}
    log_group_name  /rhsim/${ENVIRONMENT}/application
    log_stream_prefix from-tag-
    auto_create_group On

# --------------------------------------------------------------------------
# Output: Audit logs to dedicated CloudWatch group
# Retention: 2555 days (7 years) — configured in CloudWatch/Terraform,
# not in Fluent Bit. Ensure the log group has a retention policy of
# 2555 days to meet HIPAA audit trail requirements.
# --------------------------------------------------------------------------
[OUTPUT]
    Name            cloudwatch_logs
    Match           rhsim.audit
    region          ${AWS_REGION}
    log_group_name  /rhsim/${ENVIRONMENT}/audit
    log_stream_prefix from-tag-
    auto_create_group On

# --------------------------------------------------------------------------
# Output: stdout for local debugging (set FLUENT_BIT_DEBUG=true to enable)
# --------------------------------------------------------------------------
[OUTPUT]
    Name            stdout
    Match           *
    Format          json_lines
    @ENABLE         ${FLUENT_BIT_DEBUG}
