{{/*
  SealedSecret placeholder for sensitive credentials.
  In production, replace this with a Bitnami SealedSecret or use an
  external secrets operator (e.g., AWS Secrets Manager + ESO).

  To create the sealed secret:
    1. Create a regular secret YAML with your values
    2. Encrypt with kubeseal:
       kubectl create secret generic {{ include "rhsim.fullname" . }}-secrets \
         --from-literal=encryption-key=<KEY> \
         --from-literal=jwt-secret=<SECRET> \
         --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rhsim.fullname" . }}-secrets
  labels:
    {{- include "rhsim.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # Base64-encoded placeholder values -- REPLACE before deploying
  # echo -n 'CHANGE_ME' | base64
  encryption-key: Q0hBTkdFX01F
  jwt-secret: Q0hBTkdFX01F
---
{{/*
  Database credentials secret placeholder.
  In production, use AWS Secrets Manager with External Secrets Operator.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.existingSecret }}
  labels:
    {{- include "rhsim.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64-encoded placeholder values -- REPLACE before deploying
  {{ .Values.postgresql.existingSecretUsernameKey }}: Q0hBTkdFX01F
  {{ .Values.postgresql.existingSecretPasswordKey }}: Q0hBTkdFX01F
