name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - "claude/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.10', '1.11', '1.12']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - uses: julia-actions/setup-julia@v1
      with:
        version: ${{ matrix.julia-version }}
        arch: x64

    - uses: julia-actions/cache@v1

    - name: Install dependencies
      run: julia --project=. -e "using Pkg; Pkg.instantiate()"

    - name: Run tests
      run: julia --project=. -e "using Pkg; Pkg.test()"

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: julia-actions/setup-julia@v1
      with:
        version: '1.11'
        arch: x64

    - name: Install dependencies
      run: julia --project=. -e "using Pkg; Pkg.instantiate()"

    - name: Code quality checks (Aqua.jl)
      run: julia --project=. -e "
        using Aqua
        Aqua.test_all(
          HospitalFinanceToolbox;
          ambiguities=false,
          unbound_args=false,
          undefined_exports=false,
          compare_undefined=false,
          piracies=false
        )
      " || true

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: julia-actions/setup-julia@v1
      with:
        version: '1.11'
        arch: x64

    - name: Build documentation
      run: julia --project=docs -e "
        using Pkg
        Pkg.develop(PackageSpec(path=pwd()))
        Pkg.instantiate()
        include(joinpath(pwd(), 'docs', 'make.jl'))
      " || echo "Documentation build skipped (docs/make.jl not yet created)"
