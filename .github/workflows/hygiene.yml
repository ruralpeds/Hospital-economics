name: Repo Hygiene

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:       # allow manual runs from the Actions tab
  pull_request:            # also check on PRs
  push:                    # also check on push

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  check-file-dupes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for macOS dupe files
        run: |
          DUPES=$(find . -type f -not -path './.git/*' -regextype posix-extended -regex '.* [234]\..*' | wc -l)
          if [ "$DUPES" -gt 0 ]; then
            echo "❌ Found $DUPES duplicate files (macOS Finder artifacts)"
            find . -type f -not -path './.git/*' -regextype posix-extended -regex '.* [234]\..*' | head -10
            exit 1
          fi
          echo "✓ No macOS duplicate files found"

      - name: Check for dummy.jl placeholders
        run: |
          DUMMIES=$(find . -type f -name 'dummy.jl' -not -path './.git/*' | wc -l)
          if [ "$DUMMIES" -gt 0 ]; then
            echo "❌ Found $DUMMIES dummy.jl placeholder files"
            find . -type f -name 'dummy.jl' -not -path './.git/*'
            exit 1
          fi
          echo "✓ No dummy.jl placeholder files found"

  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # --- Pull Request policy ---
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: |
            This PR has had no activity for 45 days and is being marked stale.
            It will auto-close in 14 days unless there is new activity or one
            of the `keep`, `pinned`, `in-progress`, or `security` labels is applied.
          close-pr-message: |
            Closing as stale. Reopen anytime if you want to pick it back up.
          exempt-pr-labels: 'keep,pinned,in-progress,security'
          delete-branch: true

          # --- Issue policy (gentler than PRs) ---
          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: stale
          stale-issue-message: |
            This issue has had no activity for 90 days and is being marked stale.
            It will auto-close in 30 days unless there is new activity or one
            of the `keep`, `pinned`, `bug`, or `security` labels is applied.
          close-issue-message: |
            Closing as stale. Reopen anytime.
          exempt-issue-labels: 'keep,pinned,bug,security'

          # --- Safety rails ---
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true