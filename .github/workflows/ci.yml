name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop, "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.11"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Run tests with coverage
        run: |
          julia --project=. --threads=auto -e '
            using Pkg
            Pkg.add("Coverage")
            using Coverage
            Pkg.test(; coverage=true)
          '

      - name: Process coverage
        run: |
          julia --project=. -e '
            using Coverage
            coverage    = Coverage.process_folder("src")
            coverage_fe = Coverage.process_folder("packages/FinanceEngine/src")
            all_cov     = vcat(coverage, coverage_fe)
            covered, total = Coverage.get_summary(all_cov)
            pct = total > 0 ? round(100.0 * covered / total, digits=1) : 0.0
            println("Coverage: $covered / $total lines ($pct%)")
            pct >= 60.0 || error("Coverage $pct% is below the 60% minimum threshold")
          '

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e "using Pkg; Pkg.instantiate()"

      - name: Run integration tests
        run: |
          julia --project=. --threads=auto -e '
            using Test
            @testset "Integration" begin
              include("test/integration/test_auth.jl")
              include("test/integration/test_health.jl")
              include("test/integration/test_migrations.jl")
            end
          '

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e "using Pkg; Pkg.instantiate()"

      - name: Aqua.jl quality checks
        run: |
          julia --project=. -e '
            using Aqua
            Aqua.test_all(
              HospitalFinanceToolbox;
              ambiguities=false,
              unbound_args=false,
              undefined_exports=false,
              compare_undefined=false,
              piracies=false
            )
          ' || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
