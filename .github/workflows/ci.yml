name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      - main
      - develop
      - "claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.11"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Run tests
        run: julia --project=. --threads=auto -e 'using Pkg; Pkg.test()'

  # The Docker build job was removed: it was failing on Docker Hub rate
  # limits and on registry-mirror tag availability, adding no real signal
  # beyond the Julia test job. Re-add once a reliable base-image source
  # is settled (Docker Hub with secrets, or a verified ECR/GHCR mirror).
