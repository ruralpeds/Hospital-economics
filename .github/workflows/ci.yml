name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      - main
      - develop
      - "claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.11"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Run tests
        run: julia --project=. --threads=auto -e 'using Pkg; Pkg.test()'

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Temporarily non-blocking until Docker Hub credentials are configured.
    # Once DOCKERHUB_USERNAME + DOCKERHUB_TOKEN are set in repo secrets,
    # remove `continue-on-error` so Docker failures block merges again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Authenticate to Docker Hub to avoid the unauthenticated 100-pulls-per-
      # 6h rate limit that was causing 5-second failures on every PR.
      # Skipped automatically when DOCKERHUB_USERNAME is not configured so the
      # workflow doesn't break before secrets are set.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t rhsim:test .
